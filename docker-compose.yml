name: invoices

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: invoices
      POSTGRES_USER: invoices
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoices -d invoices"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    image: invoices/api:local
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${API_PORT:-8000}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: invoices
      DB_USERNAME: invoices
      DB_PASSWORD: secret
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: ./app
    image: invoices/app:local
    environment:
      NUXT_API_BASE: http://api:8000/api
      NUXT_PUBLIC_API_BASE: http://localhost:${API_PORT:-8000}/api
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  db-data:
